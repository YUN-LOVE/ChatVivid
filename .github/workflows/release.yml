name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-linux-x64:
    name: package / linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
      - name: Package
        run: |
          mkdir -p package
          cmake --install build/release --prefix "$PWD/package/chatvv"
          cp README.md package/chatvv/README.md
          tar -C package -czf chatvv-server-linux-x64.tar.gz chatvv
          sha256sum chatvv-server-linux-x64.tar.gz > chatvv-server-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-server-linux-x64
          path: |
            chatvv-server-linux-x64.tar.gz
            chatvv-server-linux-x64.tar.gz.sha256
          if-no-files-found: error

  backend-linux-arm64:
    name: package / linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev
      - name: Configure
        run: cmake --preset linux-arm64
      - name: Build
        run: cmake --build --preset linux-arm64
      - name: Test
        run: ctest --test-dir build/linux-arm64 --output-on-failure
      - name: Package
        run: |
          mkdir -p package
          cmake --install build/linux-arm64 --prefix "$PWD/package/chatvv"
          cp README.md package/chatvv/README.md
          tar -C package -czf chatvv-server-linux-arm64.tar.gz chatvv
          sha256sum chatvv-server-linux-arm64.tar.gz > chatvv-server-linux-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-server-linux-arm64
          path: |
            chatvv-server-linux-arm64.tar.gz
            chatvv-server-linux-arm64.tar.gz.sha256
          if-no-files-found: error

  backend-macos-arm64:
    name: package / macos arm64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja curl
      - name: Configure
        run: cmake --preset macos-arm64 -DCURL_ROOT="$(brew --prefix curl)"
      - name: Build
        run: cmake --build --preset macos-arm64
      - name: Test
        run: ctest --test-dir build/macos-arm64 --output-on-failure
      - name: Package
        run: |
          mkdir -p package
          cmake --install build/macos-arm64 --prefix "$PWD/package/chatvv"
          cp README.md package/chatvv/README.md
          tar -C package -czf chatvv-server-macos-arm64.tar.gz chatvv
          shasum -a 256 chatvv-server-macos-arm64.tar.gz > chatvv-server-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-server-macos-arm64
          path: |
            chatvv-server-macos-arm64.tar.gz
            chatvv-server-macos-arm64.tar.gz.sha256
          if-no-files-found: error

  backend-windows-x64:
    name: package / windows x64
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path C:\vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install --classic --triplet x64-windows curl sqlite3
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset windows-x64
      - name: Test
        run: ctest --preset windows-x64
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          cmake --install build/windows-x64 --config Release --prefix "$PWD/package/chatvv"
          Copy-Item README.md package/chatvv/README.md
          Compress-Archive -Path package/chatvv -DestinationPath chatvv-server-windows-x64.zip
          $hash = (Get-FileHash chatvv-server-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  chatvv-server-windows-x64.zip" | Out-File -Encoding ascii chatvv-server-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-server-windows-x64
          path: |
            chatvv-server-windows-x64.zip
            chatvv-server-windows-x64.zip.sha256
          if-no-files-found: error

  detect-app:
    name: detect app
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

  app-release:
    name: package / android
    needs: detect-app
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android SDK packages
        shell: bash
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build Android embedded core
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          ./scripts/build-android-ffi.sh
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64
      - name: Build AAB
        working-directory: app
        run: flutter build appbundle --release --target-platform android-arm64
      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp app/build/app/outputs/flutter-apk/app-release.apk artifacts/chatvv-app-android.apk
          cp app/build/app/outputs/bundle/release/app-release.aab artifacts/chatvv-app-android.aab
          sha256sum artifacts/chatvv-app-android.apk artifacts/chatvv-app-android.aab > artifacts/chatvv-app-android.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-app-android
          path: artifacts/*
          if-no-files-found: error

  release:
    name: github release
    needs:
      - backend-linux-x64
      - backend-linux-arm64
      - backend-macos-arm64
      - backend-windows-x64
      - app-release
    if: ${{ always() && needs.backend-linux-x64.result == 'success' && needs.backend-linux-arm64.result == 'success' && needs.backend-macos-arm64.result == 'success' && needs.backend-windows-x64.result == 'success' && (needs.app-release.result == 'success' || needs.app-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          ls -lh
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
