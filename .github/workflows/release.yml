name: Release

# Tag scheme (see docs/ci-cd.md):
#   vX.Y.Z                          build + publish every enabled platform
#   vX.Y.Z-<platform>[-<platform>]  only the listed platforms
#   vX.Y.Z-<unknown>                fail with a clear message
# workflow_dispatch only builds artifacts for the selected platforms; it never
# publishes a GitHub Release (tag pushes do).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: '逗号分隔平台子集（android,ios,linux,macos,windows）；留空=全部启用平台'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Parse the tag / manual platform list into a build matrix.
  # ---------------------------------------------------------------------------
  parse-tag:
    name: parse tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.parse.outputs.source }}
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      platforms_label: ${{ steps.parse.outputs.platforms_label }}
      platforms: ${{ steps.parse.outputs.platforms }}
      backend_platforms: ${{ steps.parse.outputs.backend_platforms }}
      app_platforms: ${{ steps.parse.outputs.app_platforms }}
      app_matrix: ${{ steps.parse.outputs.app_matrix }}
      run_backend: ${{ steps.parse.outputs.run_backend }}
      run_app: ${{ steps.parse.outputs.run_app }}
      publish: ${{ steps.parse.outputs.publish }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse tag
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
        run: python3 platforms/common/ci/parse-tag.py
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release plan"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| source | \`${{ steps.parse.outputs.source }}\` |"
            echo "| version | \`${{ steps.parse.outputs.version }}\` |"
            echo "| publish | \`${{ steps.parse.outputs.publish }}\` |"
            echo "| platforms | \`${{ steps.parse.outputs.platforms }}\` |"
            echo "| backend | \`${{ steps.parse.outputs.backend_platforms }}\` |"
            echo "| app | \`${{ steps.parse.outputs.app_platforms }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # C++ backend packages: Linux x64 + arm64 (native runners, Vulkan ON).
  # ---------------------------------------------------------------------------
  backend-linux:
    name: package / linux ${{ matrix.arch }}
    needs: parse-tag
    if: contains(fromJSON(needs.parse-tag.outputs.backend_platforms), 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            preset: release
            artifact: chatvv-server-linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            preset: linux-arm64
            artifact: chatvv-server-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build + Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev \
            libvulkan-dev glslc spirv-headers vulkan-tools
          glslc --version | head -n 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/read_aloud/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCHATVV_VULKAN=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Package
        shell: bash
        run: |
          mkdir -p package
          cmake --install "build/${{ matrix.preset }}" --prefix "$PWD/package/chatvv"
          cp README.md package/chatvv/README.md
          ARCH="${{ matrix.arch }}"
          tar -C package -czf "chatvv-server-linux-${ARCH}.tar.gz" chatvv
          sha256sum "chatvv-server-linux-${ARCH}.tar.gz" > "chatvv-server-linux-${ARCH}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            chatvv-server-*.tar.gz
            chatvv-server-*.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # C++ backend package: macOS arm64 (CPU/Metal; Vulkan is rejected on Apple).
  # ---------------------------------------------------------------------------
  backend-macos:
    name: package / macos arm64
    needs: parse-tag
    if: contains(fromJSON(needs.parse-tag.outputs.backend_platforms), 'macos')
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: brew install cmake ninja curl
      - name: Configure
        run: cmake --preset macos-arm64 -DCURL_ROOT="$(brew --prefix curl)" -DCHATVV_VULKAN=OFF
      - name: Build
        run: cmake --build --preset macos-arm64
      - name: Test
        run: ctest --preset macos-arm64
      - name: Package
        run: |
          mkdir -p package
          cmake --install build/macos-arm64 --prefix "$PWD/package/chatvv"
          cp README.md package/chatvv/README.md
          tar -C package -czf chatvv-server-macos-arm64.tar.gz chatvv
          shasum -a 256 chatvv-server-macos-arm64.tar.gz > chatvv-server-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-server-macos-arm64
          path: |
            chatvv-server-macos-arm64.tar.gz
            chatvv-server-macos-arm64.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # C++ backend package: Windows x64 (MSVC + vcpkg + Vulkan SDK).
  # ---------------------------------------------------------------------------
  backend-windows:
    name: package / windows x64
    needs: parse-tag
    if: contains(fromJSON(needs.parse-tag.outputs.backend_platforms), 'windows')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/read_aloud/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path C:\vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install --classic --triplet x64-windows curl sqlite3
      - name: Configure
        run: cmake --preset windows-x64 -DCHATVV_VULKAN=ON
      - name: Build
        run: cmake --build --preset windows-x64
      - name: Test
        run: ctest --preset windows-x64
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          cmake --install build/windows-x64 --config Release --prefix "$PWD/package/chatvv"
          Copy-Item README.md package/chatvv/README.md
          Compress-Archive -Path package/chatvv -DestinationPath chatvv-server-windows-x64.zip
          $hash = (Get-FileHash chatvv-server-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  chatvv-server-windows-x64.zip" | Out-File -Encoding ascii chatvv-server-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-server-windows-x64
          path: |
            chatvv-server-windows-x64.zip
            chatvv-server-windows-x64.zip.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Flutter app packages for the platforms selected by the tag. Same matrix
  # shape as ci.yml's app-package job, with release build commands.
  # ---------------------------------------------------------------------------
  app-release:
    name: package / app ${{ matrix.platform }}
    needs: parse-tag
    if: needs.parse-tag.outputs.run_app == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.parse-tag.outputs.app_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'   # keep in sync with docs/install-arch.md
          channel: stable
          cache: true
      - name: Rust toolchain (read-aloud)
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Cache cargo registry
        if: matrix.rust_targets != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/read_aloud/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install cargo-ndk (Android fallback cross tool)
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk --locked
      - name: Install Vulkan SDK
        if: matrix.platform == 'windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
      - name: Install Vulkan build dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers vulkan-tools
          glslc --version | head -n 2
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsqlite3-dev libcurl4-openssl-dev libssl-dev
      - name: Install macOS desktop dependencies
        if: matrix.platform == 'macos'
        run: brew install cmake ninja curl
      - name: Android SDK packages
        if: matrix.platform == 'android'
        shell: bash
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build Android FFI + read-aloud
        if: matrix.platform == 'android'
        shell: bash
        env:
          CHATVV_VULKAN: ${{ matrix.vulkan }}
          CHATVV_READ_ALOUD_LINKAGE: shared
        # Android target Vulkan headers/libs come from the NDK sysroot; the host
        # glslc + SPIRV-Headers come from the apt packages above. Pin both so a
        # cross-configure cannot pick up host x86_64 Vulkan libraries (known risk,
        # see platforms/android/README.md).
        run: |
          export ANDROID_VULKAN_CMAKE_ARGS=""
          if [ -f /usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake ]; then
            ANDROID_VULKAN_CMAKE_ARGS="-DSPIRV-Headers_DIR=/usr/share/cmake/SPIRV-Headers"
          fi
          if command -v glslc >/dev/null; then
            ANDROID_VULKAN_CMAKE_ARGS="$ANDROID_VULKAN_CMAKE_ARGS -DVulkan_GLSLC_EXECUTABLE=$(command -v glslc)"
          fi
          export ANDROID_VULKAN_CMAKE_ARGS
          set +e
          ./platforms/android/build-ffi.sh 2>&1 | tee /tmp/build-ffi.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg="$(tail -n 40 /tmp/build-ffi.log \
              | sed -r 's/\x1B\[[0-9;]*[mK]//g' \
              | tr -d '\r' \
              | sed 's/%/%25/g' \
              | awk 'BEGIN{ORS="%0A"} {print}' \
              | head -c 7000)"
            echo "::error::build-ffi.sh failed (exit $rc):%0A${msg}"
            exit "$rc"
          fi
      - name: Configure Android signing (unified key)
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: ./platforms/android/setup-signing.sh --required
      - name: Build and package (bash)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CHATVV_VULKAN: ${{ matrix.vulkan }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: ${{ matrix.command }}
      - name: Build and package (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHATVV_VULKAN: ${{ matrix.vulkan }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          $rc = 0
          try {
            & ${{ matrix.command }} 2>&1 | Tee-Object -FilePath package.log
            $rc = $LASTEXITCODE
          } catch {
            $rc = 1
            ($_ | Out-String) | Tee-Object -FilePath package.log -Append
          }
          if ($rc -ne 0) {
            $lines = (Get-Content package.log -Tail 25) | ForEach-Object { $_ -replace '%', '%25' -replace "`r", '' }
            Write-Output "::error::package failed (exit $rc):%0A$($lines -join '%0A')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Gate: skipped (not-selected) jobs are fine; failures are not.
  # ---------------------------------------------------------------------------
  gate:
    name: verify selected jobs
    needs:
      - parse-tag
      - backend-linux
      - backend-macos
      - backend-windows
      - app-release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every selected build job succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          test "$(echo "$NEEDS_JSON" | jq -r '.["parse-tag"].result')" = "success"
          # macOS is cost-gated (ENABLE_MACOS_RUNNERS): its legs are cancelled
          # intentionally, which makes the aggregate result of backend-macos /
          # app-release "cancelled" even when every non-macOS platform built
          # fine. Failures still surface as "failure".
          echo "$NEEDS_JSON" | jq -e '
            to_entries
            | map(select(.key != "parse-tag"))
            | all(
                .value.result == "success"
                or .value.result == "skipped"
                or (((.key == "backend-macos") or (.key == "app-release"))
                    and .value.result == "cancelled")
              )
          '

  # ---------------------------------------------------------------------------
  # Publish (tag pushes only). Artifact file names already carry the platform.
  # ---------------------------------------------------------------------------
  release:
    name: github release
    needs:
      - parse-tag
      - gate
    if: always() && needs.parse-tag.outputs.publish == 'true' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          ls -lh
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.parse-tag.outputs.tag }}
          name: chatvv ${{ needs.parse-tag.outputs.version }} (${{ needs.parse-tag.outputs.platforms_label }})
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ needs.parse-tag.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
