name: windows diag
on:
  push:
    branches: [diag/windows-rag]
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install --classic --triplet x64-windows curl sqlite3
      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          cmake -S . -B build/diag -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_MODE=OFF
      - name: Build
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          cmake --build build/diag --config RelWithDebInfo 2>&1 | Tee-Object build-diag.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build-diag.log -Pattern 'error|failed|fatal' -CaseSensitive:$false |
              Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }
