name: CI

on:
  push:
    branches:
      - dev
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux-x64:
    name: backend / linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  backend-linux-arm64:
    name: backend / linux arm64
    # GitHub-hosted arm64 runner. If unavailable on your plan, replace with
    # the arm64-cross preset + qemu, or a self-hosted arm64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev
      - name: Configure
        run: cmake --preset linux-arm64
      - name: Build
        run: cmake --build --preset linux-arm64
      - name: Test
        run: ctest --preset linux-arm64
      - name: Test details
        if: failure()
        shell: bash
        run: |
          LOG=$(find build -name LastTest.log | head -1)
          if [ -n "$LOG" ]; then
            echo "::error::$(tr '\n' '%0A' < "$LOG" | head -c 3000)"
          fi

  backend-macos-arm64:
    name: backend / macos arm64
    # Temporarily disabled to avoid macOS runner overage.
    if: false
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja curl
      - name: Configure
        run: cmake --preset macos-arm64 -DCURL_ROOT="$(brew --prefix curl)"
      - name: Build
        run: cmake --build --preset macos-arm64
      - name: Test
        run: ctest --preset macos-arm64
      - name: Test details
        if: failure()
        shell: bash
        run: |
          LOG=$(find build -name LastTest.log | head -1)
          if [ -n "$LOG" ]; then
            echo "::error::$(tr '\n' '%0A' < "$LOG" | head -c 3000)"
          fi

  backend-windows-x64:
    name: backend / windows x64
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path C:\vcpkg)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install --classic --triplet x64-windows curl sqlite3
      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x64 *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content configure.log
            $idx = ($lines | Select-String -Pattern "CMake Error|error:|Error" | Select-Object -First 1).LineNumber
            if ($idx -eq $null) { $idx = 1 }
            $start = [Math]::Max(0, $idx - 2)
            $end = [Math]::Min($lines.Count - 1, $idx + 18)
            $msg = ($lines[$start..$end] -join "%0A")
            Write-Output "::error::$msg"
            exit 1
          }
      - name: Build
        run: cmake --build --preset windows-x64
      - name: Test
        run: ctest --preset windows-x64

  app-linux:
    name: app / linux
    needs: detect-app
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config             libgtk-3-dev libsqlite3-dev libcurl4-openssl-dev libssl-dev
      - name: Build and package
        run: ./scripts/package-desktop-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-app-linux
          path: artifacts/*
          if-no-files-found: error

  app-windows:
    name: app / windows
    needs: detect-app
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build and package
        shell: pwsh
        run: ./scripts/package-desktop-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-app-windows
          path: artifacts/*
          if-no-files-found: error

  app-macos:
    name: app / macos
    needs: detect-app
    # Temporarily disabled to avoid macOS runner overage.
    if: false
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install desktop dependencies
        run: brew install cmake ninja curl
      - name: Build and package
        run: ./scripts/package-desktop-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-app-macos
          path: artifacts/*
          if-no-files-found: error

  detect-app:
    name: detect app
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    name: app / analyze & build
    needs: detect-app
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android SDK packages
        shell: bash
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build Android embedded core
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          ./scripts/build-android-ffi.sh
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Rive native setup
        working-directory: app
        run: dart run rive_native:setup --verbose -p android
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        shell: bash
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No app tests yet"
          fi
      - name: Build debug APK
        working-directory: app
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.$COUNT"
          flutter build apk --debug --target-platform android-arm64 \
            --build-name="$VERSION" --build-number="$COUNT" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=BUILD_NUMBER="$COUNT" \
            --dart-define=BUILD_COMMIT="$SHA"
      - name: Verify Android 16 KB page size and signature
        shell: bash
        run: |
          ./scripts/verify-android-apk.sh             app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chatvv-app-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
